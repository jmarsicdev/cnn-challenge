[project]
name = "cnn-challenge"
version = "0.1.0"
description = "ITCS 6169/8169 Assignment 1: 16-class scene recognition from 2,400 images with a CNN"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0",
    "numpy",
    "pyyaml",
    "matplotlib",
    "scikit-learn",
    "pandas",
    "tqdm",
    "tensorboard",
    "pillow",
]

[project.optional-dependencies]
dev = ["jupyterlab", "ipykernel", "gdown"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
